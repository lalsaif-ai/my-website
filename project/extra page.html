<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extra Page</title>
    <style>
        /* General Styles */
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #F1C6E0, #F4D6D1); /* Smooth gradient blending light pink and light peach */
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Header Styles */
        header {
            background-color: #f1f1f1;
            padding: 20px;
        }

     header img {
      width: 100%;
      height: 100px;
      object-fit: cover;
    }

        h1 {
            color: #333;
        }

        h2 {
            color: #666;
        }

        /* Table Styles */
        table {
            width: 60%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        td {
            padding: 15px;
            text-align: center;
            border: 1px solid #ccc;
        }

        .cell1 {
            background-color: #A8D0E6; /* Light Blue */
        }

        .cell2 {
            background-color: #B9F6CA; /* Light Green */
        }

        .cell3 {
            background-color: #D9D1A7; /* Beige */
        }

        .cell4 {
            background-color: #F1C6E0; /* Light Pink */
        }

        .cell5 {
            background-color: #D9C2B8; /* Light Brown */
        }

        .cell6 {
            background-color: #FFB76B; /* Orange on Beige */
        }

        .cell7 {
            background-color: #FFFFFF; /* White */
        }
    </style>
</head>
<body>

    <!-- Header Section with Logo -->
    <header>
        <img src="logo.JPG" alt="Logo" id="logo">
        <h1>Extra Page</h1>
        <h2>My Favorite Colors</h2>
    </header>

    <!-- Table Section -->
    <section>
        <table>
            <tr>
                <td class="cell1">1</td>
            </tr>
            <tr>
                <td class="cell2">2</td>
                <td class="cell3">3</td>
                <td class="cell4">4</td>
            </tr>
            <tr>
                <td class="cell5">5</td>
                <td class="cell6">6</td>
            </tr>
            <tr>
                <td class="cell7">7</td>
            </tr>
        </table>
    </section>

</body>
</html>
